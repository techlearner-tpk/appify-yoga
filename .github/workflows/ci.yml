name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      - run: mvn -B verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend-api frontend
      - uses: aquasecurity/trivy-action@0.30.0
        with: {image-ref: 'appify-yoga-backend-api',format: 'table',exit-code: '1',severity: 'CRITICAL,HIGH'}
      - name: Tag validated images on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag appify-yoga-backend-api appify-yoga-backend-api:${GITHUB_SHA}
          docker tag appify-yoga-frontend appify-yoga-frontend:${GITHUB_SHA}
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: ./scripts/smoke.sh
      - run: python3 scripts/integration_flow.py
      - run: python3 scripts/content_smoke.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: always()
        run: docker compose down -v
